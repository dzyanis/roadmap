name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Graphviz and xmllint
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz libxml2-utils
      - name: Validate roadmap and materials XML
        run: make check
      - name: Run tests and build all stacks
        run: make test
