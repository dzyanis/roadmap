name: D2 prototype
on:
  pull_request:
    paths:
      - 'docs/prototypes/d2/**'
      - 'tests/test_prototype_d2.py'
      - 'subjects/**'
      - 'roadmaps/**'
      - 'tools/**'
      - '.github/workflows/prototype-d2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: docs/prototypes/d2/package-lock.json
      - name: Install baseline and XML tools
        run: sudo apt-get update && sudo apt-get install --yes graphviz libxml2-utils
      - name: Install locked browser tools
        working-directory: docs/prototypes/d2
        run: npm ci
      - name: Install D2 0.9.0 (verified release archive)
        run: |
          curl -fL https://github.com/d2lang/d2/releases/download/v0.9.0/d2-v0.9.0-linux-amd64.tar.gz -o /tmp/d2.tar.gz
          echo '5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9  /tmp/d2.tar.gz' | sha256sum --check
          tar -xzf /tmp/d2.tar.gz -C /tmp
          echo '/tmp/d2-v0.9.0/bin' >> "$GITHUB_PATH"
      - name: Check committed XML/data parity
        run: python3 -m unittest discover -s tests -p 'test_prototype_d2.py' -v
      - name: Rebuild the experiment
        run: python3 docs/prototypes/d2/build.py
      - name: Check desktop/mobile interaction and produce PNG previews
        working-directory: docs/prototypes/d2
        run: npm test
      - name: Upload runnable static demo and evidence
        uses: actions/upload-artifact@v4
        with:
          name: d2-prototype
          path: |
            docs/prototypes/d2/demo/
            docs/prototypes/d2/previews/
            docs/prototypes/d2/browser-results.json
